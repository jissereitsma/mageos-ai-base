name: zizmor

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main, for the same reason as check-extension.
  pull_request:

# zizmor only reads the workflows; its online audits query public repositories with this token.
permissions:
  contents: read

jobs:
  # Static analysis of the workflows themselves: unpinned or impostor action commits, tokens that
  # can write, persisted checkout credentials, untrusted input expanded into scripts. Each of these
  # was fixed by hand once; this keeps a later workflow edit from bringing one back.
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Plain pass/fail instead of uploading SARIF to code scanning, which would need
      # security-events: write. The zizmor version is pinned so a new audit in a later release
      # cannot turn an unrelated pull request red.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          version: 1.31.1
